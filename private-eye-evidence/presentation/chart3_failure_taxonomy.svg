<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="100%" height="100%" fill="#0B0F19" rx="12"/>
  <rect x="20" y="20" width="760" height="410" fill="#111827" rx="8" stroke="#1F2937" stroke-width="1"/>
  
  <text x="50" y="60" fill="#F9FAFB" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700">Failure Attribution Taxonomy (N=11 Failed Runs)</text>
  <text x="50" y="85" fill="#9CA3AF" font-family="system-ui, -apple-system, sans-serif" font-size="13">72.7% stochastic asynchronous browser timing vs. 27.3% deterministic agent logic</text>
  
  <!-- Category 1: Stale Ref (36.4% - 4 runs) -->
  <text x="60" y="130" fill="#F9FAFB" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Stale Reference (DOM mutation)</text>
  <rect x="280" y="115" width="364" height="22" fill="#3B82F6" rx="4"/>
  <text x="660" y="131" fill="#3B82F6" font-family="monospace" font-size="12" font-weight="700">36.4% (4) [Stochastic]</text>
  
  <!-- Category 2: Post-Condition Timing (18.2% - 2 runs) -->
  <text x="60" y="175" fill="#F9FAFB" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Post-Condition Network Delay</text>
  <rect x="280" y="160" width="182" height="22" fill="#06B6D4" rx="4"/>
  <text x="480" y="176" fill="#06B6D4" font-family="monospace" font-size="12" font-weight="700">18.2% (2) [Stochastic]</text>
  
  <!-- Category 3: No-Progress Detection (18.2% - 2 runs) -->
  <text x="60" y="220" fill="#F9FAFB" font-family="system-ui, sans-serif" font-size="13" font-weight="600">No-Progress Bounded Stop</text>
  <rect x="280" y="205" width="182" height="22" fill="#10B981" rx="4"/>
  <text x="480" y="221" fill="#10B981" font-family="monospace" font-size="12" font-weight="700">18.2% (2) [Stochastic]</text>
  
  <!-- Category 4: Semantic Selection (9.1% - 1 run) -->
  <text x="60" y="265" fill="#F9FAFB" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Semantic Selection Failure</text>
  <rect x="280" y="250" width="91" height="22" fill="#F59E0B" rx="4"/>
  <text x="390" y="266" fill="#F59E0B" font-family="monospace" font-size="12" font-weight="700">9.1% (1) [Deterministic]</text>
  
  <!-- Category 5: Ambiguous Target (9.1% - 1 run) -->
  <text x="60" y="310" fill="#F9FAFB" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Target Ambiguity / Safe Abstain</text>
  <rect x="280" y="295" width="91" height="22" fill="#8B5CF6" rx="4"/>
  <text x="390" y="311" fill="#8B5CF6" font-family="monospace" font-size="12" font-weight="700">9.1% (1) [Deterministic]</text>

  <!-- Category 6: Model Timeout (9.1% - 1 run) -->
  <text x="60" y="355" fill="#F9FAFB" font-family="system-ui, sans-serif" font-size="13" font-weight="600">VLM Gateway / HTTP Timeout</text>
  <rect x="280" y="340" width="91" height="22" fill="#F43F5E" rx="4"/>
  <text x="390" y="356" fill="#F43F5E" font-family="monospace" font-size="12" font-weight="700">9.1% (1) [Deterministic]</text>

  <!-- Summary Card -->
  <rect x="60" y="380" width="680" height="35" fill="#1E293B" rx="6"/>
  <text x="400" y="402" fill="#F9FAFB" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">
    Key Insight: Zero infinite loops; failures manifest as bounded, observable state stops rather than runaway executions.
  </text>
</svg>