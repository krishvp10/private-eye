<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="100%" height="100%" fill="#0B0F19" rx="12"/>
  <rect x="20" y="20" width="760" height="410" fill="#111827" rx="8" stroke="#1F2937" stroke-width="1"/>
  
  <text x="50" y="60" fill="#F9FAFB" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700">Fault Recovery &amp; Anti-Loop Architecture</text>
  <text x="50" y="85" fill="#9CA3AF" font-family="system-ui, -apple-system, sans-serif" font-size="13">Blind retry vs. Fresh reasoning with progressive state re-observation</text>
  
  <!-- Left Side: Blind Retry -->
  <rect x="80" y="120" width="290" height="270" fill="#18181B" rx="8" stroke="#F43F5E" stroke-width="1.5"/>
  <text x="225" y="155" fill="#F43F5E" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Blind Action Retry</text>
  <text x="225" y="175" fill="#9CA3AF" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">(Standard Agent Baseline)</text>
  
  <text x="105" y="220" fill="#9CA3AF" font-family="system-ui, sans-serif" font-size="13">• Repeats stale ref execution</text>
  <text x="105" y="245" fill="#9CA3AF" font-family="system-ui, sans-serif" font-size="13">• No DOM re-observation</text>
  <text x="105" y="270" fill="#9CA3AF" font-family="system-ui, sans-serif" font-size="13">• 100% infinite loop hazard</text>
  
  <rect x="100" y="310" width="250" height="50" fill="#F43F5E" rx="6" opacity="0.15"/>
  <text x="225" y="333" fill="#F43F5E" font-family="monospace" font-size="16" font-weight="700" text-anchor="middle">0.0% RECOVERY</text>
  <text x="225" y="350" fill="#F43F5E" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Repeated Target Loops: HIGH</text>
  
  <!-- Right Side: Fresh Reasoning -->
  <rect x="430" y="120" width="290" height="270" fill="#18181B" rx="8" stroke="#10B981" stroke-width="1.5"/>
  <text x="575" y="155" fill="#10B981" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Fresh Reasoning + State</text>
  <text x="575" y="175" fill="#9CA3AF" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">(PrivateEye Frozen Architecture)</text>
  
  <text x="455" y="220" fill="#9CA3AF" font-family="system-ui, sans-serif" font-size="13">• Live DOM re-capture &amp; fresh ref</text>
  <text x="455" y="245" fill="#9CA3AF" font-family="system-ui, sans-serif" font-size="13">• Mutation &amp; progress validation</text>
  <text x="455" y="270" fill="#9CA3AF" font-family="system-ui, sans-serif" font-size="13">• 0.0% repeated target loops</text>
  
  <rect x="450" y="310" width="250" height="50" fill="#10B981" rx="6" opacity="0.15"/>
  <text x="575" y="333" fill="#10B981" font-family="monospace" font-size="16" font-weight="700" text-anchor="middle">100.0% RECOVERY</text>
  <text x="575" y="350" fill="#10B981" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Repeated Target Loops: 0.0%</text>
</svg>