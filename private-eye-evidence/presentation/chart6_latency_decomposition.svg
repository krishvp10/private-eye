<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="100%" height="100%" fill="#0B0F19" rx="12"/>
  <rect x="20" y="20" width="760" height="410" fill="#111827" rx="8" stroke="#1F2937" stroke-width="1"/>
  
  <text x="50" y="60" fill="#F9FAFB" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700">Latency Decomposition: Local Pipeline vs Remote VLM</text>
  <text x="50" y="85" fill="#9CA3AF" font-family="system-ui, -apple-system, sans-serif" font-size="13">Microsecond local deterministic gating vs multi-second multimodal inference</text>
  
  <!-- Left Box: Local Pipeline (0.16 ms) -->
  <rect x="70" y="120" width="310" height="280" fill="#18181B" rx="8" stroke="#06B6D4" stroke-width="1.5"/>
  <text x="225" y="155" fill="#06B6D4" font-family="system-ui, sans-serif" font-size="17" font-weight="700" text-anchor="middle">Local Client Controls</text>
  <text x="225" y="175" fill="#9CA3AF" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Deterministic Python / Playwright Engine</text>
  
  <text x="95" y="215" fill="#F9FAFB" font-family="system-ui, sans-serif" font-size="12">Candidate Generation &amp; Ranking:</text>
  <text x="350" y="215" fill="#06B6D4" font-family="monospace" font-size="12" font-weight="700" text-anchor="end">0.080 ms</text>
  
  <text x="95" y="245" fill="#F9FAFB" font-family="system-ui, sans-serif" font-size="12">Kill-Switch Dispatch Gate:</text>
  <text x="350" y="245" fill="#06B6D4" font-family="monospace" font-size="12" font-weight="700" text-anchor="end">0.043 ms</text>
  
  <text x="95" y="275" fill="#F9FAFB" font-family="system-ui, sans-serif" font-size="12">Local Policy Rule Evaluation:</text>
  <text x="350" y="275" fill="#06B6D4" font-family="monospace" font-size="12" font-weight="700" text-anchor="end">0.040 ms</text>
  
  <line x1="95" y1="300" x2="355" y2="300" stroke="#374151" stroke-width="1"/>
  
  <text x="95" y="325" fill="#F9FAFB" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Total Local Overhead:</text>
  <text x="350" y="325" fill="#06B6D4" font-family="monospace" font-size="14" font-weight="700" text-anchor="end">~0.163 ms</text>
  
  <rect x="95" y="345" width="260" height="35" fill="#06B6D4" rx="4" opacity="0.15"/>
  <text x="225" y="367" fill="#06B6D4" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Near-Zero Security/Policy Latency</text>
  
  <!-- Right Box: Remote VLM Inference (7.29 s) -->
  <rect x="420" y="120" width="310" height="280" fill="#18181B" rx="8" stroke="#8B5CF6" stroke-width="1.5"/>
  <text x="575" y="155" fill="#8B5CF6" font-family="system-ui, sans-serif" font-size="17" font-weight="700" text-anchor="middle">Remote / Local VLM</text>
  <text x="575" y="175" fill="#9CA3AF" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Qwen2.5-VL-3B Multimodal Backbone</text>
  
  <text x="445" y="215" fill="#F9FAFB" font-family="system-ui, sans-serif" font-size="12">VLM Semantic Turn (p50):</text>
  <text x="700" y="215" fill="#8B5CF6" font-family="monospace" font-size="12" font-weight="700" text-anchor="end">7,290 ms (7.29 s)</text>
  
  <text x="445" y="245" fill="#F9FAFB" font-family="system-ui, sans-serif" font-size="12">VLM Semantic Turn (p95):</text>
  <text x="700" y="245" fill="#8B5CF6" font-family="monospace" font-size="12" font-weight="700" text-anchor="end">9,850 ms (9.85 s)</text>
  
  <text x="445" y="275" fill="#F9FAFB" font-family="system-ui, sans-serif" font-size="12">Selective Crop Verification:</text>
  <text x="700" y="275" fill="#8B5CF6" font-family="monospace" font-size="12" font-weight="700" text-anchor="end">~1,850 ms</text>
  
  <line x1="445" y1="300" x2="705" y2="300" stroke="#374151" stroke-width="1"/>
  
  <text x="445" y="325" fill="#F9FAFB" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Total Turn Latency:</text>
  <text x="700" y="325" fill="#8B5CF6" font-family="monospace" font-size="14" font-weight="700" text-anchor="end">~7.30 s</text>
  
  <rect x="445" y="345" width="260" height="35" fill="#8B5CF6" rx="4" opacity="0.15"/>
  <text x="575" y="367" fill="#8B5CF6" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Local Safety Adds &lt;0.003% Overhead</text>
</svg>