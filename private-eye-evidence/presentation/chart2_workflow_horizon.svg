<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="100%" height="100%" fill="#0B0F19" rx="12"/>
  <rect x="20" y="20" width="760" height="410" fill="#111827" rx="8" stroke="#1F2937" stroke-width="1"/>
  
  <text x="50" y="60" fill="#F9FAFB" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700">Task Success &amp; Step Accuracy vs. Workflow Horizon</text>
  <text x="50" y="85" fill="#9CA3AF" font-family="system-ui, -apple-system, sans-serif" font-size="13">Evaluation across 100 live end-to-end runs (911 evaluated steps)</text>
  
  <!-- Y-Axis Gridlines & Labels -->
  <line x1="80" y1="350" x2="740" y2="350" stroke="#374151" stroke-width="1"/>
  <text x="65" y="355" fill="#9CA3AF" font-family="monospace" font-size="11" text-anchor="end">0%</text>
  
  <line x1="80" y1="290" x2="740" y2="290" stroke="#1F2937" stroke-width="1" stroke-dasharray="4"/>
  <text x="65" y="295" fill="#9CA3AF" font-family="monospace" font-size="11" text-anchor="end">25%</text>
  
  <line x1="80" y1="230" x2="740" y2="230" stroke="#1F2937" stroke-width="1" stroke-dasharray="4"/>
  <text x="65" y="235" fill="#9CA3AF" font-family="monospace" font-size="11" text-anchor="end">50%</text>
  
  <line x1="80" y1="170" x2="740" y2="170" stroke="#1F2937" stroke-width="1" stroke-dasharray="4"/>
  <text x="65" y="175" fill="#9CA3AF" font-family="monospace" font-size="11" text-anchor="end">75%</text>
  
  <line x1="80" y1="110" x2="740" y2="110" stroke="#1F2937" stroke-width="1" stroke-dasharray="4"/>
  <text x="65" y="115" fill="#9CA3AF" font-family="monospace" font-size="11" text-anchor="end">100%</text>

  <!-- Legend -->
  <rect x="520" y="45" width="12" height="12" fill="#06B6D4" rx="2"/>
  <text x="540" y="55" fill="#9CA3AF" font-family="system-ui, sans-serif" font-size="11">Task Success %</text>
  <rect x="640" y="45" width="12" height="12" fill="#10B981" rx="2"/>
  <text x="660" y="55" fill="#9CA3AF" font-family="system-ui, sans-serif" font-size="11">Step Accuracy %</text>
  
  <!-- Short Horizon (3-5 steps): Task 100% (h=240, y=110), Step 100% (h=240, y=110) -->
  <rect x="130" y="110" width="55" height="240" fill="#06B6D4" rx="4"/>
  <text x="157" y="100" fill="#06B6D4" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">100.0%</text>
  <rect x="195" y="110" width="55" height="240" fill="#10B981" rx="4"/>
  <text x="222" y="100" fill="#10B981" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">100.0%</text>
  <text x="190" y="375" fill="#F9FAFB" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Short (3–5 steps)</text>
  <text x="190" y="395" fill="#9CA3AF" font-family="monospace" font-size="11" text-anchor="middle">32/32 tasks | 136/136 steps</text>
  
  <!-- Medium Horizon (6-10 steps): Task 88.89% (h=213.3, y=136.7), Step 98.59% (h=236.6, y=113.4) -->
  <rect x="330" y="137" width="55" height="213" fill="#06B6D4" rx="4"/>
  <text x="357" y="127" fill="#06B6D4" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">88.9%</text>
  <rect x="395" y="113" width="55" height="237" fill="#10B981" rx="4"/>
  <text x="422" y="103" fill="#10B981" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">98.6%</text>
  <text x="390" y="375" fill="#F9FAFB" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Medium (6–10 steps)</text>
  <text x="390" y="395" fill="#9CA3AF" font-family="monospace" font-size="11" text-anchor="middle">32/36 tasks | 280/284 steps</text>
  
  <!-- Long Horizon (11-20 steps): Task 78.12% (h=187.5, y=162.5), Step 98.57% (h=236.6, y=113.4) -->
  <rect x="530" y="163" width="55" height="187" fill="#06B6D4" rx="4"/>
  <text x="557" y="153" fill="#06B6D4" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">78.1%</text>
  <rect x="595" y="113" width="55" height="237" fill="#10B981" rx="4"/>
  <text x="622" y="103" fill="#10B981" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">98.6%</text>
  <text x="590" y="375" fill="#F9FAFB" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Long (11–20 steps)</text>
  <text x="590" y="395" fill="#9CA3AF" font-family="monospace" font-size="11" text-anchor="middle">25/32 tasks | 484/491 steps</text>
</svg>