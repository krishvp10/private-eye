<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="100%" height="100%" fill="#0B0F19" rx="12"/>
  <rect x="20" y="20" width="760" height="410" fill="#111827" rx="8" stroke="#1F2937" stroke-width="1"/>
  
  <text x="50" y="60" fill="#F9FAFB" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700">Grounding Accuracy Across Architectural Stages</text>
  <text x="50" y="85" fill="#9CA3AF" font-family="system-ui, -apple-system, sans-serif" font-size="13">Progression from unconstrained vision baseline to constrained verifier pipeline</text>
  
  <!-- Y-Axis Gridlines & Labels -->
  <line x1="80" y1="360" x2="740" y2="360" stroke="#374151" stroke-width="1"/>
  <text x="65" y="365" fill="#9CA3AF" font-family="monospace" font-size="11" text-anchor="end">0%</text>
  
  <line x1="80" y1="295" x2="740" y2="295" stroke="#1F2937" stroke-width="1" stroke-dasharray="4"/>
  <text x="65" y="300" fill="#9CA3AF" font-family="monospace" font-size="11" text-anchor="end">25%</text>
  
  <line x1="80" y1="230" x2="740" y2="230" stroke="#1F2937" stroke-width="1" stroke-dasharray="4"/>
  <text x="65" y="235" fill="#9CA3AF" font-family="monospace" font-size="11" text-anchor="end">50%</text>
  
  <line x1="80" y1="165" x2="740" y2="165" stroke="#1F2937" stroke-width="1" stroke-dasharray="4"/>
  <text x="65" y="170" fill="#9CA3AF" font-family="monospace" font-size="11" text-anchor="end">75%</text>
  
  <line x1="80" y1="100" x2="740" y2="100" stroke="#1F2937" stroke-width="1" stroke-dasharray="4"/>
  <text x="65" y="105" fill="#9CA3AF" font-family="monospace" font-size="11" text-anchor="end">100%</text>
  
  <!-- Stage 1: Raw Vision Baseline (25.9%) -> height = 25.9 * 2.6 = 67.3px, y = 360 - 67 = 293 -->
  <rect x="120" y="293" width="90" height="67" fill="#F43F5E" rx="4" opacity="0.85"/>
  <text x="165" y="280" fill="#F43F5E" font-family="monospace" font-size="14" font-weight="700" text-anchor="middle">25.9%</text>
  <text x="165" y="385" fill="#F9FAFB" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Raw Vision</text>
  <text x="165" y="402" fill="#9CA3AF" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Unconstrained Baseline</text>
  
  <!-- Stage 2: ScreenGraph (68.7%) -> height = 68.7 * 2.6 = 178.6px, y = 360 - 179 = 181 -->
  <rect x="270" y="181" width="90" height="179" fill="#F59E0B" rx="4" opacity="0.85"/>
  <text x="315" y="168" fill="#F59E0B" font-family="monospace" font-size="14" font-weight="700" text-anchor="middle">68.7%</text>
  <text x="315" y="385" fill="#F9FAFB" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">+ ScreenGraph</text>
  <text x="315" y="402" fill="#9CA3AF" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">DOM/ARIA Hierarchy</text>
  
  <!-- Stage 3: Local Candidates (88.7%) -> height = 88.67 * 2.6 = 230.5px, y = 360 - 231 = 129 -->
  <rect x="420" y="129" width="90" height="231" fill="#3B82F6" rx="4" opacity="0.85"/>
  <text x="465" y="116" fill="#3B82F6" font-family="monospace" font-size="14" font-weight="700" text-anchor="middle">88.7%</text>
  <text x="465" y="385" fill="#F9FAFB" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">+ Candidates</text>
  <text x="465" y="402" fill="#9CA3AF" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Local Top-K Extraction</text>
  
  <!-- Stage 4: Selective Verifier (98.0%) -> height = 98.0 * 2.6 = 254.8px, y = 360 - 255 = 105 -->
  <rect x="570" y="105" width="90" height="255" fill="#10B981" rx="4" opacity="0.95"/>
  <text x="615" y="92" fill="#10B981" font-family="monospace" font-size="14" font-weight="700" text-anchor="middle">98.0%</text>
  <text x="615" y="385" fill="#F9FAFB" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">+ Verifier</text>
  <text x="615" y="402" fill="#9CA3AF" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Visual Crop Verification</text>
</svg>