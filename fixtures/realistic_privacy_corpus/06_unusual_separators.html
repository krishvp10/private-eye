<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Corpus 06 — PII with Unusual Separators</title>
  <style>
    body { font-family: monospace; background: #fdfbf7; padding: 2rem; color: #1c1917; }
    .box { max-width: 600px; margin: 0 auto; background: #fff; border: 1px dashed #d97706; padding: 1.5rem; border-radius: 6px; }
    .item { margin-bottom: 1rem; }
    label { display: block; font-weight: bold; margin-bottom: 0.25rem; font-size: 0.85rem; }
    input { width: 100%; padding: 0.4rem; font-family: inherit; border: 1px solid #78716c; border-radius: 4px; box-sizing: border-box; }
    button { background: #d97706; color: #fff; padding: 0.5rem 1rem; border: none; border-radius: 4px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="box">
    <h3>Non-Standard PII Formatting</h3>
    <div class="item">
      <label for="sep_aadhaar">Aadhaar with Hyphen Delimiters</label>
      <input type="text" id="sep_aadhaar" value="8942-5102-6631">
    </div>
    <div class="item">
      <label for="sep_phone">Phone Number with International Parentheses</label>
      <input type="text" id="sep_phone" value="(+91) 98450-12345">
    </div>
    <div class="item">
      <label for="sep_pan">Spaced PAN Code</label>
      <input type="text" id="sep_pan" value="ABC DE 1234 F">
    </div>
    <button id="sep_btn_submit">Verify Separators</button>
  </div>
</body>
</html>
