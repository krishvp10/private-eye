<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <title>Corpus 09 — Multilingual Bilingual Indian Labels</title>
  <style>
    body { font-family: 'Segoe UI', 'Nirmala UI', sans-serif; background: #faf5ff; padding: 2rem; }
    .form-card { max-width: 650px; margin: 0 auto; background: white; border-radius: 10px; border: 1px solid #e9d5ff; padding: 2rem; }
    h2 { color: #6b21a8; margin-top: 0; }
    .row { margin-bottom: 1.25rem; }
    label { display: block; font-weight: 600; color: #581c87; margin-bottom: 0.35rem; font-size: 0.9rem; }
    input { width: 100%; padding: 0.5rem; border: 1px solid #d8b4fe; border-radius: 6px; box-sizing: border-box; }
    button { background: #7e22ce; color: white; border: none; padding: 0.6rem 1.5rem; border-radius: 6px; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>
  <div class="form-card">
    <h2>राष्ट्रीय पहचान पोर्टल • National Identity Portal</h2>
    <div class="row">
      <label for="multi_aadhaar">आधार संख्या / Aadhaar Number</label>
      <input type="text" id="multi_aadhaar" value="9012 4431 8890">
    </div>
    <div class="row">
      <label for="multi_pan">स्थायी खाता संख्या / Income Tax PAN</label>
      <input type="text" id="multi_pan" value="KRPPV3301L">
    </div>
    <div class="row">
      <label for="multi_phone">मोबाइल नंबर / Mobile Phone</label>
      <input type="tel" id="multi_phone" value="9876501234">
    </div>
    <button id="btn_multi_submit">सत्यापित करें / Submit Verification</button>
  </div>
</body>
</html>
