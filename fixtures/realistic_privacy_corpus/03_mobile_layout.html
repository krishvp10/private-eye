<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=375, initial-scale=1.0">
  <title>Corpus 03 — Mobile Viewport Screen</title>
  <style>
    body { font-family: -apple-system, sans-serif; margin: 0; padding: 1rem; background: #fafafa; color: #111; width: 375px; box-sizing: border-box; }
    .mobile-card { background: #fff; border: 1px solid #e5e5e5; border-radius: 12px; padding: 1rem; }
    h3 { font-size: 1.1rem; margin-top: 0; }
    .touch-field { margin-bottom: 1rem; }
    label { font-size: 0.8rem; font-weight: 600; color: #555; }
    input { width: 100%; height: 44px; font-size: 1rem; border: 1px solid #ccc; border-radius: 8px; padding: 0 0.5rem; box-sizing: border-box; }
    .btn-mobile { width: 100%; height: 48px; background: #10b981; color: #fff; border: none; border-radius: 8px; font-size: 1rem; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>
  <div class="mobile-card">
    <h3>Mobile Patient Portal</h3>
    <div class="touch-field">
      <label for="mob_uhid">Patient ABHA / UHID</label>
      <input type="text" id="mob_uhid" value="ABHA-9812-4410-0012">
    </div>
    <div class="touch-field">
      <label for="mob_dob">Patient Birth Date</label>
      <input type="text" id="mob_dob" value="1978-04-12">
    </div>
    <button class="btn-mobile" id="btn_mob_confirm">Confirm Intake</button>
  </div>
</body>
</html>
