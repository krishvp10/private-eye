<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Corpus 02 — High-Contrast Dark Mode</title>
  <style>
    body { font-family: 'JetBrains Mono', monospace; background: #090d16; color: #f8fafc; padding: 2rem; }
    .terminal-box { max-width: 600px; margin: 0 auto; background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 2rem; box-shadow: 0 0 25px rgba(56,189,248,0.1); }
    h2 { color: #38bdf8; font-size: 1.2rem; margin-bottom: 1.5rem; text-transform: uppercase; }
    .field-row { margin-bottom: 1rem; }
    label { display: block; color: #94a3b8; font-size: 0.75rem; margin-bottom: 0.35rem; }
    input { width: 100%; background: #020617; border: 1px solid #1e293b; color: #38bdf8; padding: 0.5rem; border-radius: 4px; font-family: inherit; }
    .btn-neon { background: #0284c7; color: #fff; border: none; padding: 0.6rem 1.5rem; border-radius: 4px; font-weight: 700; cursor: pointer; margin-top: 1rem; }
  </style>
</head>
<body>
  <div class="terminal-box">
    <h2>Vault Terminal • Dark Mode</h2>
    <div class="field-row">
      <label for="dark_email">Encrypted Email Address</label>
      <input type="email" id="dark_email" value="ananya.sharma@cybernet.in">
    </div>
    <div class="field-row">
      <label for="dark_phone">Secured Contact Line</label>
      <input type="tel" id="dark_phone" value="+91 9123456780">
    </div>
    <div class="field-row">
      <label for="dark_pass">Master Cryptographic Passphrase</label>
      <input type="password" id="dark_pass" value="CyberGuard#2026!">
    </div>
    <button class="btn-neon" id="dark_btn_auth">Authenticate Terminal</button>
  </div>
</body>
</html>
