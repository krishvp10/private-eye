name: PrivateEye Benchmark

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "mock is CI-safe; real requires a configured endpoint"
        required: true
        default: mock
        type: choice
        options:
          - mock
          - real
      server_url:
        description: "PrivateEye API URL"
        required: false
        default: http://127.0.0.1:8100
        type: string

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Run mock benchmark
        if: inputs.mode == 'mock'
        run: python -m eval.benchmark
      - name: Run explicitly configured real benchmark
        if: inputs.mode == 'real'
        env:
          PRIVATEEYE_VLM_MODE: real
          PRIVATEEYE_VLM_BASE_URL: ${{ vars.PRIVATEEYE_VLM_BASE_URL }}
          PRIVATEEYE_VLM_MODEL: ${{ vars.PRIVATEEYE_VLM_MODEL }}
          PRIVATEEYE_VLM_API_KEY: ${{ secrets.PRIVATEEYE_VLM_API_KEY }}
        run: |
          python -m eval.real_vlm_experiment \
            --server-url "${{ inputs.server_url }}" \
            --runs 5 \
            --output eval/reports/real_vlm_report.json
          python -m eval.context_ablation \
            --server-url "${{ inputs.server_url }}" \
            --output eval/reports/context_ablation.json
          python -m eval.real_vlm_canary \
            --server-url "${{ inputs.server_url }}" \
            --output eval/reports/real_vlm_canaries.json
          python -m eval.model_comparison \
            --server-url "${{ inputs.server_url }}" \
            --output eval/reports/model_comparison.json
      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: privateeye-benchmark-${{ inputs.mode }}
          path: |
            eval/reports/*.json
            eval/reports/*.md
          if-no-files-found: warn
